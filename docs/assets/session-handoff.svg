<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="380" viewBox="0 0 1180 380" role="img" aria-labelledby="title desc">
  <title id="title">QuadSpell: New chat. Same mission.</title>
  <desc id="desc">Choose a task with saved context and recorded progress, copy it once, and paste it into the AI conversation you want to use next.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b32"/>
      <stop offset="1" stop-color="#172b46"/>
    </linearGradient>
  </defs>
  <rect width="1180" height="380" rx="18" fill="url(#background)"/>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <text x="34" y="34" fill="#83aaf8" font-size="12" letter-spacing="2">QUADSPELL</text>
    <text x="34" y="74" fill="#f5f8ff" font-size="32" font-weight="700">New chat. Same mission.</text>
    <text x="34" y="102" fill="#b7c8e5" font-size="15">一键复制任务上下文，随时切换 AI 会话</text>

    <rect x="34" y="124" width="378" height="188" rx="12" fill="#1e304b" stroke="#405777"/>
    <text x="56" y="155" fill="#f5f8ff" font-size="17" font-weight="700">1  Pick a task</text>
    <g fill="#c7d6ec" font-size="15">
      <text x="75" y="188">Goal and background</text>
      <text x="75" y="217">Code and reference pointers</text>
      <text x="75" y="246">Scope and constraints</text>
      <text x="75" y="275">Recorded progress</text>
    </g>
    <g fill="#75d9ba">
      <circle cx="59" cy="183" r="4"/>
      <circle cx="59" cy="212" r="4"/>
      <circle cx="59" cy="241" r="4"/>
      <circle cx="59" cy="270" r="4"/>
    </g>

    <path d="M421 218h23m-7-7 7 7-7 7" fill="none" stroke="#8cb5ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="456" y="124" width="272" height="188" rx="12" fill="#2453a0" stroke="#6d9be8"/>
    <text x="592" y="155" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">2  Copy once</text>
    <rect x="568" y="184" width="50" height="63" rx="7" fill="#eaf2ff"/>
    <rect x="579" y="177" width="28" height="13" rx="4" fill="#94bfff" stroke="#2453a0" stroke-width="2"/>
    <path d="M579 205h27m-27 10h27m-27 10h19" stroke="#376dbd" stroke-width="3" stroke-linecap="round"/>
    <text x="592" y="276" fill="#e7f0ff" font-size="15" text-anchor="middle">Saved context → clipboard</text>

    <path d="M737 218h23m-7-7 7 7-7 7" fill="none" stroke="#8cb5ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="772" y="124" width="374" height="188" rx="12" fill="#1e304b" stroke="#405777"/>
    <text x="794" y="155" fill="#f5f8ff" font-size="17" font-weight="700">3  Paste into your next AI chat</text>
    <g fill="#2b4263" stroke="#59718f">
      <rect x="794" y="180" width="95" height="33" rx="7"/>
      <rect x="900" y="180" width="86" height="33" rx="7"/>
      <rect x="997" y="180" width="91" height="33" rx="7"/>
    </g>
    <g fill="#e4efff" font-size="13" text-anchor="middle">
      <text x="841.5" y="202">ChatGPT</text>
      <text x="943" y="202">Claude</text>
      <text x="1042.5" y="202">Gemini</text>
    </g>
    <text x="794" y="244" fill="#c7d6ec" font-size="15">A fresh session. A different AI.</text>
    <text x="794" y="274" fill="#75d9ba" font-size="15">Any chat that accepts text.</text>
    <text x="590" y="350" fill="#b7c8e5" font-size="14" text-anchor="middle">Record progress. Copy again whenever you switch.</text>
  </g>
</svg>
